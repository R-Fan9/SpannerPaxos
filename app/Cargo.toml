[package]
name = "spx_app"
version = "0.1.0"
edition = "2024"

[dependencies]
spx_core = { path = "../core" }
spx_lib = { path = "../lib" }
spx_protocol = { path = "../protocol" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.18"
tonic = "0.14.5"
prost-types = "0.14.3"
chrono = "0.4.44"
uuid = { version = "1.10", features = ["v4"] }
serde = { version = "1.0.228", features = ["derive"] }
dashmap = "6.0"

