syntax = "proto3";

package spx.messages;

import "google/protobuf/timestamp.proto";

message ReplicateWriteRequest {
    // The term (ballot) number of leader who sent the write request
    uint32 term = 1;

    // The slot number of the log entry
    uint32 slot = 2;

    // The log entry
    string entry = 3;

    // The timestamp assigned to the log entry by the leader
    google.protobuf.Timestamp write_time = 4;

    // The lease expiration time of the leader
    google.protobuf.Timestamp lease_expiry_time = 5;
}

message ReplicateWriteResponse {
    // The ID of the follower who replicated the log entry
    string member_id = 1;

    // The term (ballot) number in which the log entry was replicated on
    uint32 term = 2;

    // The slot number of log entry that got replicated
    uint32 slot = 3;
}
